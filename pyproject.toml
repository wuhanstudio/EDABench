[project]
name = "edabench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cairosvg>=2.9.0",
    "gdstk>=1.0.0",
    "librelane>=3.0.4",
    "loguru>=0.7.3",
    "matplotlib>=3.11.0",
    "streamlit>=1.58.0",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "opencv-python",
    "tqdm>=4.70.0",
    "pytorch-msssim>=1.0.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "black>=26.5.1",
]
